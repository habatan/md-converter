version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      # ホストOSとコンテナ間でファイルの変更検知（ホットリロード）を確実に行うための設定
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
    tty: true
  
  backend:
    build:
      context: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    # 起動時にライブラリをインストールし、ホットリロード有効でFastAPIを起動
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
